<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — Тренажёр немецкого</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" aria-label="Сменить тему">🌙</button>

<div class="wrap" style="max-width:640px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
    <a class="back-link" href="/index.html" style="margin-bottom:0;">← Назад к тренажёру</a>
    <button class="small-btn ghost-btn" id="logout-btn">Выйти</button>
  </div>
  <h1>Админ-панель: слова</h1>

  <div class="admin-section">
    <h2>Новая категория</h2>
    <div class="inline-form">
      <input type="text" id="new-category-name" placeholder="Например: Глаголы A1">
      <button id="add-category-btn">Добавить категорию</button>
    </div>
  </div>

  <div class="admin-section" id="category-picker-section">
    <h2>Категория для редактирования</h2>
    <div class="category-select-row">
      <select id="category-select" aria-label="Выбор категории"></select>
      <button class="small-btn ghost-btn" id="rename-category-btn">Переименовать</button>
      <button class="small-btn danger-btn" id="delete-category-btn">Удалить</button>
    </div>
  </div>

  <p class="empty-note" id="no-categories-note" style="display:none;">Категорий пока нет. Добавь первую выше.</p>

  <div class="admin-section" id="category-detail-section" style="display:none;">
    <div class="inline-form">
      <input type="text" id="new-word-de" placeholder="по-немецки">
      <input type="text" id="new-word-ru" placeholder="перевод">
      <button id="add-word-btn">Добавить слово</button>
    </div>

    <input type="text" id="word-filter-input" class="filter-input" placeholder="Поиск по словам в этой категории…">

    <div class="word-table-wrap">
      <table id="words-table">
        <thead><tr><th>Немецкий</th><th>Перевод</th><th></th></tr></thead>
        <tbody id="words-tbody"></tbody>
      </table>
    </div>
    <p class="empty-note" id="words-empty-note" style="display:none;"></p>
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
